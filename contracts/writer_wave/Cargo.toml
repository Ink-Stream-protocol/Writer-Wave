[package]
name = "writer_wave"
version = "0.1.0"
edition = "2021"
description = "The Writer's Wave: recurring Writing Sprints where authors, readers and contributors earn points that convert into a share of a reward pool."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
